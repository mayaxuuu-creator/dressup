<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>千禧衣橱 · 经典换装</title>
<style>
:root{
  --pink:#FF6FA5; --pink2:#FF9EC4; --pink3:#FFD3E4;
  --cream:#FFF6F0; --ink:#5A4048; --lav:#C9AEF0; --gold:#FFD98A;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",-apple-system,sans-serif;
  background:linear-gradient(160deg,#FFF3EC 0%,#FFDCEB 55%,#F3D8F5 100%);
  color:var(--ink); overflow:hidden; user-select:none; -webkit-user-select:none;
}
#app{height:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column;position:relative}
/* ---------- 顶栏 ---------- */
header{
  display:flex;align-items:center;gap:8px;padding:10px 12px 8px;
  transition:opacity .3s, transform .3s;
}
.logo{font-weight:900;font-size:20px;letter-spacing:1px;white-space:nowrap}
.logo small{font-size:11px;font-weight:600;color:#C79AAB;margin-left:4px}
.tabs{display:flex;background:#fff;border-radius:999px;padding:3px;box-shadow:0 3px 10px rgba(255,111,165,.18)}
.tabs button{
  border:0;background:transparent;padding:6px 12px;border-radius:999px;font-size:13px;font-weight:700;
  color:#B98FA0;cursor:pointer;transition:all .2s;font-family:inherit;
}
.tabs button.on{background:linear-gradient(135deg,var(--pink2),var(--pink));color:#fff;box-shadow:0 2px 8px rgba(255,111,165,.4)}
.spacer{flex:1}
.icobtn{
  width:38px;height:38px;border:0;border-radius:50%;font-size:17px;cursor:pointer;
  background:#fff;box-shadow:0 3px 10px rgba(200,120,150,.22);color:var(--ink);
  transition:transform .12s;display:flex;align-items:center;justify-content:center;font-family:inherit;
}
.icobtn:active{transform:scale(.88)}
/* ---------- 舞台 ---------- */
#stageWrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:0 10px;position:relative}
#scene{
  height:100%;max-height:100%;aspect-ratio:500/750;border-radius:22px;overflow:hidden;
  box-shadow:0 10px 34px rgba(214,110,160,.28), 0 0 0 5px rgba(255,255,255,.75);
  background:#FFE9F2;
}
#doll{transform-origin:250px 700px}
#doll.boing{animation:boing .42s ease}
@keyframes boing{0%{transform:scale(1,1)}30%{transform:scale(1.025,.955)}60%{transform:scale(.985,1.03)}100%{transform:scale(1,1)}}
.spark{transform-box:fill-box;transform-origin:center;animation:sparkpop .6s ease forwards;pointer-events:none}
@keyframes sparkpop{0%{transform:scale(.2) rotate(0deg);opacity:0}30%{transform:scale(1.15) rotate(20deg);opacity:1}100%{transform:scale(.4) rotate(40deg);opacity:0}}
/* 挑战要求条 */
#reqBanner{
  position:absolute;top:8px;left:50%;transform:translateX(-50%);z-index:5;
  background:rgba(255,255,255,.92);border-radius:16px;padding:7px 12px;display:none;
  align-items:center;gap:6px;box-shadow:0 4px 14px rgba(200,110,150,.25);max-width:94%;flex-wrap:wrap;justify-content:center;
}
#reqBanner.show{display:flex}
.chip{font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;color:#fff}
.chip.t{background:linear-gradient(135deg,var(--pink2),var(--pink))}
.chip.c{background:#fff;color:var(--ink);border:2px solid var(--pink3);font-size:11px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:2px;vertical-align:-1px}
#reqBanner .line{font-size:11px;font-weight:700;color:#B07A90;width:100%;text-align:center;margin-top:2px}
#submitBtn{
  position:absolute;right:14px;bottom:12px;z-index:5;display:none;border:0;cursor:pointer;
  background:linear-gradient(135deg,#FF8FB8,#FF5C9E);color:#fff;font-weight:900;font-size:14px;
  padding:11px 18px;border-radius:999px;box-shadow:0 6px 18px rgba(255,92,158,.5);font-family:inherit;
  animation:pulse 1.6s ease infinite;
}
#submitBtn.show{display:block}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
/* ---------- 衣柜 ---------- */
#wardrobe{
  background:rgba(255,255,255,.92);border-radius:22px 22px 0 0;padding:8px 10px 12px;
  box-shadow:0 -6px 24px rgba(200,110,150,.2);transition:opacity .3s, transform .3s;
}
.wdHead{display:flex;align-items:center;gap:6px;margin-bottom:7px}
.slotTabs{display:flex;gap:4px;flex:1;overflow-x:auto;scrollbar-width:none}
.slotTabs::-webkit-scrollbar{display:none}
.slotTabs button{
  border:0;background:var(--pink3);color:#A96882;padding:6px 11px;border-radius:999px;
  font-size:12.5px;font-weight:800;cursor:pointer;white-space:nowrap;transition:all .15s;font-family:inherit;
}
.slotTabs button.on{background:linear-gradient(135deg,var(--pink2),var(--pink));color:#fff;box-shadow:0 3px 8px rgba(255,111,165,.4)}
.wdHint{font-size:10.5px;color:#C99BAD;white-space:nowrap}
#grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;max-height:198px;overflow-y:auto;padding:2px 2px 6px;scrollbar-width:thin;align-content:start}
.card{
  background:#fff;border-radius:14px;border:2.5px solid #FFE3EF;padding:3px;cursor:pointer;position:relative;
  transition:transform .12s, border-color .15s;
}
.card:active{transform:scale(.9)}
.card svg{width:100%;height:64px;display:block;border-radius:10px}
.card.sel{border-color:var(--pink);background:#FFF0F7}
.card.sel::after{content:"✓";position:absolute;top:2px;right:4px;font-size:14px;font-weight:900;color:#fff;background:var(--pink);border-radius:50%;width:18px;height:18px;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(255,111,165,.5)}
.card.locked svg{filter:grayscale(1) opacity(.45)}
.card.locked::before{content:"🔒";position:absolute;top:4px;left:6px;font-size:12px;z-index:2}
/* ---------- 通用弹层 ---------- */
.overlay{
  position:fixed;inset:0;background:rgba(90,64,72,.45);backdrop-filter:blur(3px);z-index:50;
  display:none;align-items:center;justify-content:center;padding:20px;
}
.overlay.show{display:flex}
.panel{
  background:linear-gradient(170deg,#FFFBF7,#FFF0F6);border-radius:26px;padding:22px 20px;width:100%;max-width:420px;
  box-shadow:0 20px 60px rgba(120,50,90,.4);max-height:86vh;overflow-y:auto;position:relative;
  animation:panelin .35s cubic-bezier(.2,1.4,.4,1);
}
@keyframes panelin{from{transform:translateY(40px) scale(.92);opacity:0}to{transform:none;opacity:1}}
.panel h2{font-size:19px;font-weight:900;text-align:center;margin-bottom:4px}
.panel .sub{font-size:12px;color:#C08CA4;text-align:center;margin-bottom:14px}
.bigbtn{
  display:block;width:100%;border:0;cursor:pointer;border-radius:999px;padding:13px;
  font-size:15px;font-weight:900;color:#fff;font-family:inherit;margin-top:10px;
  background:linear-gradient(135deg,var(--pink2),var(--pink));box-shadow:0 6px 18px rgba(255,92,158,.4);
  transition:transform .12s;
}
.bigbtn:active{transform:scale(.96)}
.bigbtn.ghost{background:#fff;color:var(--pink);border:2px solid var(--pink3);box-shadow:none}
/* 章节卡 */
.chCard{
  border-radius:18px;padding:13px 14px;margin-bottom:10px;cursor:pointer;position:relative;
  background:#fff;box-shadow:0 4px 14px rgba(200,110,150,.15);border:2.5px solid transparent;transition:all .15s;
}
.chCard:active{transform:scale(.97)}
.chCard.go{border-color:var(--pink)}
.chCard h3{font-size:15.5px;font-weight:900}
.chCard .meta{font-size:11px;color:#B58498;margin-top:4px;line-height:1.7}
.chCard .tagRow{display:flex;gap:5px;margin-top:6px;flex-wrap:wrap}
.chCard .best{position:absolute;top:12px;right:13px;font-size:11px;font-weight:800;color:var(--pink)}
.chCard .done{position:absolute;top:30px;right:13px;font-size:11px;color:#8FBF8F;font-weight:800}
.chCard.lockd{opacity:.55}
/* 评分结果 */
#scoreBig{font-size:56px;font-weight:900;text-align:center;line-height:1.1;
  background:linear-gradient(135deg,#FF5C9E,#B07CE8);-webkit-background-clip:text;background-clip:text;color:transparent}
#gradeBadge{
  width:86px;height:86px;margin:6px auto;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:44px;font-weight:900;color:#fff;box-shadow:0 8px 22px rgba(255,92,158,.4);
  animation:stamp .5s cubic-bezier(.2,1.6,.4,1) .5s backwards;
}
@keyframes stamp{from{transform:scale(2.4) rotate(-18deg);opacity:0}to{transform:none;opacity:1}}
.scoreRow{display:flex;align-items:center;gap:8px;margin:7px 0;font-size:12.5px;font-weight:700}
.scoreRow .lab{width:62px;text-align:right;color:#A8758B}
.scoreRow .bar{flex:1;height:12px;background:#FFE3EF;border-radius:99px;overflow:hidden}
.scoreRow .fill{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--pink2),var(--pink));width:0;transition:width .8s ease}
.scoreRow .val{width:44px;font-weight:900}
/* 解锁 */
#unlockGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
#unlockGrid .card{animation:flyin .55s cubic-bezier(.2,1.5,.4,1) backwards}
@keyframes flyin{from{transform:translateY(-70px) rotate(-8deg);opacity:0}to{transform:none;opacity:1}}
/* toast */
#toast{
  position:fixed;left:50%;bottom:24%;transform:translateX(-50%) translateY(10px);z-index:99;
  background:rgba(90,64,72,.88);color:#fff;padding:9px 18px;border-radius:999px;font-size:13px;font-weight:700;
  opacity:0;transition:all .25s;pointer-events:none;white-space:nowrap;
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
/* 隐藏UI */
body.zen header, body.zen #wardrobe, body.zen #reqBanner, body.zen #submitBtn{opacity:0;pointer-events:none;transform:translateY(20px)}
body.zen #stageWrap{padding:0}
body.zen #scene{box-shadow:none;border-radius:0}
#zenHint{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);font-size:12px;color:#fff;background:rgba(90,64,72,.5);
  padding:6px 14px;border-radius:99px;display:none;z-index:60}
body.zen #zenHint{display:block}
</style>
</head>

  <div id="resBtns"></div>
</div></div>

function sparkle(n=7){

    const x=190+Math.random()*120, y=90+Math.random()*480, s=9+Math.random()*13;
    const p=document.createElementNS('http://www.w3.org/2000/svg','path');
    p.setAttribute('d',star(x,y,s).match(/ d="([^"]+)"/)[1]);
    p.setAttribute('fill',Math.random()<.5?'#FFF6C8':'#FFD3E4');
    p.setAttribute('class','spark'); p.style.animationDelay=(i*40)+'ms';
    G.fx.appendChild(p); setTimeout(()=>p.remove(),800);
  }
  const d=$('#doll'); d.classList.remove('boing'); void d.offsetWidth; d.classList.add('boing');
}

/* ============ 音效（WebAudio 合成） ============ */
let AC=null;
function tone(f,dur,type='sine',when=0,vol=.16){
  if(S.muted)return; if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();
  const t=AC.currentTime+when, o=AC.createOscillator(), g=AC.createGain();
  o.type=type;o.frequency.value=f;
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.015);g.gain.exponentialRampToValueAtTime(.001,t+dur);
  o.connect(g).connect(AC.destination);o.start(t);o.stop(t+dur+.05);
}
const SFX={
  click:()=>tone(880,.07,'triangle',0,.1),
  wear:()=>{tone(523,.1,'sine');tone(784,.14,'sine',.07)},
  score:()=>{[523,659,784,1046].forEach((f,i)=>tone(f,.16,'sine',i*.09,.14))},
  unlock:()=>{[392,523,659,784,1046,1318].forEach((f,i)=>tone(f,.2,'triangle',i*.08,.13))},
  fail:()=>{tone(233,.3,'sine',0,.12);tone(196,.4,'sine',.18,.1)},
};

function itemSVG(it){
  if(it.slot==='hair'){
    const head=`<ellipse cx="250" cy="150" rx="66" ry="74" fill="${SKIN}"/>`;
    return `<svg viewBox="${it.thumb.join(' ')}" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">${(it.back||'')+head+(it.front||'')}</svg>`;

  return `<svg viewBox="${it.thumb.join(' ')}" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">${it.svg}</svg>`;
}
function renderGrid(){
  const list=ITEMS.filter(i=>i.slot===curTab);
  $('#grid').innerHTML=list.map(it=>{
    const un=isUnlocked(it), worn=S.outfit[it.slot]===it.id;
    return `<div class="card ${worn?'sel':''} ${un?'':'locked'}" data-id="${it.id}">
      ${itemSVG(it)}<div style="text-align:center;font-size:9.5px;font-weight:700;color:#A8758B;padding:1px 0 2px;overflow:hidden;white-space:nowrap">${it.name}</div></div>`;
  }).join('');

    const it=ITEM[c.dataset.id];
    if(!isUnlocked(it)){toast(it.how==='ball'?'🔒 通关第一章解锁哦～':'🔒 通关第二章解锁哦～');SFX.fail();return}
    wear(it);
  });
}
function wear(it,silent){
  const o=S.outfit;
  if(it.slot==='acc'){o.acc=o.acc===it.id?null:it.id}
  else if(it.slot==='dress'){o.dress=it.id;o.top=null;o.bottom=null}
  else if(it.slot==='top'){o.dress=null;o.top=it.id;if(!o.bottom)o.bottom='B01'}
  else if(it.slot==='bottom'){o.dress=null;o.bottom=it.id;if(!o.top)o.top='T01'}
  else o[it.slot]=it.id;
  render();renderGrid();save();
  if(!silent){SFX.wear();sparkle()}
}
function randomOutfit(){
  const pool=unlockedItems(), pick=s=>{const a=pool.filter(i=>i.slot===s);return a.length?a[Math.floor(Math.random()*a.length)].id:(s==='top'?'T01':s==='bottom'?'B01':null)};
  const o=S.outfit, dresses=pool.filter(i=>i.slot==='dress');
  if(dresses.length&&Math.random()<.5){o.dress=dresses[Math.floor(Math.random()*dresses.length)].id;o.top=o.bottom=null}
  else{o.dress=null;o.top=pick('top');o.bottom=pick('bottom')}
  o.hair=pick('hair');o.shoes=pick('shoes');o.acc=Math.random()<.75?pick('acc'):null;
  render();renderGrid();save();SFX.wear();sparkle(10);
}
function resetOutfit(){S.outfit={...DEF_OUTFIT};render();renderGrid();save();SFX.wear();sparkle(5)}

/* ============ 评分（机制 v2 公式） ============ */
function score(ch){
  const o=S.outfit, plan=o.dress?4:5;
  const slots=o.dress?['hair','dress','shoes','acc']:['hair','top','bottom','shoes','acc'];
  let tag=0,col=0;
  slots.forEach(s=>{const id=o[s];if(!id)return;const it=ITEM[id];
    if(it.tags.some(t=>ch.tags.includes(t)))tag++;
    if(ch.palette.includes(it.color))col++});
  const fit=Math.round(60*tag/plan), colr=Math.round(20*col/plan);
  const cmp=4+((o.dress||(o.top&&o.bottom))?8:0)+(o.shoes?4:0)+(o.acc?4:0);
  return{fit,colr,cmp,total:fit+colr+cmp};
}

/* ============ 模式切换 ============ */
function setMode(m){
  mode=m;
  $('#tabFree').classList.toggle('on',m==='free');
  $('#tabCh').classList.toggle('on',m==='challenge');
  $('#submitBtn').classList.toggle('show',m==='challenge'&&!!curCh);
  $('#reqBanner').classList.toggle('show',m==='challenge'&&!!curCh);
  if(m==='free'){curCh=null;renderReq()}
  render();
}
function renderReq(){
  if(mode!=='challenge'||!curCh){$('#reqBanner').classList.remove('show');return}
  const best=S.best[curCh.id];
  $('#reqBanner').innerHTML=
    `<span class="chip t">${curCh.tags.join(' · ')}</span>
     <span class="chip c">${curCh.palette.map(c=>`<span class="dot" style="background:${P_DOT[c]}"></span>${c}`).join('')}</span>
     <span class="line">过关线 ${curCh.pass} 分${best!==undefined?` · 当前最佳 ${best}`:''}</span>`;
  $('#reqBanner').classList.add('show');$('#submitBtn').classList.add('show');
}
function openChapters(){
  $('#chList').innerHTML=CHAPTERS.map((ch,i)=>{
    const idx=i+1, locked=idx>S.unlocked, done=S.cleared[ch.id], best=S.best[ch.id];
    return `<div class="chCard ${locked?'lockd':'go'}" data-ch="${ch.id}">
      <h3>${ch.emoji}${ch.title}</h3>
      <div class="meta">${ch.story}</div>
      <div class="tagRow"><span class="chip t">${ch.tags.join(' · ')}</span>
      <span class="chip c">${ch.palette.map(c=>`<span class="dot" style="background:${P_DOT[c]}"></span>${c}`).join('')}</span></div>
      <div class="meta">过关线 ${ch.pass} 分 · 奖励：${ch.reward==='title'?'称号「千禧搭配大师」+ 纪念背景':'新服饰 6 件'}</div>
      ${best!==undefined?`<div class="best">最佳 ${best}</div>`:''}
      ${done?'<div class="done">已通关 ✓</div>':''}
      ${locked?'<div class="best" style="color:#B58498">🔒 未解锁</div>':''}
    </div>`;
  }).join('');
  $('#chList').querySelectorAll('.chCard').forEach(c=>c.onclick=()=>{
    const ch=CHAPTERS.find(x=>x.id===c.dataset.ch);
    if(CHAPTERS.indexOf(ch)+1>S.unlocked){toast('先通关前面的章节哦～');SFX.fail();return}
    curCh=ch;setMode('challenge');renderReq();hide('ovChapters');SFX.click();
  });
  show('ovChapters');
}

/* ============ 交卷 ============ */
function submit(){
  if(mode!=='challenge'||!curCh)return;
  const ch=curCh, r=score(ch);
  const g=GRADES.find(x=>r.total>=x[0]);
  const pass=r.total>=ch.pass, first=!S.cleared[ch.id]&&pass;
  if(pass)S.cleared[ch.id]=true; else S.cleared[ch.id]=S.cleared[ch.id]||false;
  S.best[ch.id]=Math.max(S.best[ch.id]||0,r.total);
  if(ch.reward==='title'&&first)S.gotTitle=true;
  if(first&&ch.id==='lv1')S.unlocked=Math.max(S.unlocked,2);
  if(first&&ch.id==='lv2')S.unlocked=Math.max(S.unlocked,3);
  save();
  $('#resTitle').textContent=pass?'过关啦 ✨':'再试一次 ♡';
  $('#resSub').textContent=ch.title.replace(/^第.章 · /,'')+' · '+ch.story;
  $('#gradeBadge').textContent=g[1];
  $('#gradeBadge').style.background=g[1]==='S'?'linear-gradient(135deg,#FF9EC4,#B07CE8)':g[1]==='A'?'linear-gradient(135deg,#FFB7CE,#FF6FA5)':g[1]==='B'?'linear-gradient(135deg,#8FCBE8,#5BA8E8)':'linear-gradient(135deg,#C9B4BC,#A0889A)';
  $('#gradeTxt').textContent=g[1]+' 级 · '+g[2];
  let n=0;const t=setInterval(()=>{n=Math.min(r.total,n+3);$('#scoreBig').textContent=n;if(n>=r.total)clearInterval(t)},24);
  $('#barFit').style.width='0';$('#barCol').style.width='0';$('#barCmp').style.width='0';
  setTimeout(()=>{$('#barFit').style.width=(r.fit/60*100)+'%';$('#barCol').style.width=(r.colr/20*100)+'%';$('#barCmp').style.width=(r.cmp/20*100)+'%'},80);
  $('#valFit').textContent=r.fit+'/60';$('#valCol').textContent=r.colr+'/20';$('#valCmp').textContent=r.cmp+'/20';
  const nxt=CHAPTERS[CHAPTERS.indexOf(ch)+1];
  $('#resBtns').innerHTML=
    (first&&ch.reward!=='title'?`<button class="bigbtn" id="btnUnlock">看看新衣服 🎁</button>`:'')+
    (pass&&nxt&&S.unlocked>=CHAPTERS.indexOf(nxt)+1?`<button class="bigbtn ${first&&ch.reward!=='title'?'ghost':''}" id="btnNext">下一章出发 💗</button>`:'')+
    (pass&&S.gotTitle&&ch.id==='lv3'&&first?`<button class="bigbtn" id="btnTitle">领取称号 🏆</button>`:'')+
    `<button class="bigbtn ghost" data-close>回去改搭配 ✏️</button>`;
  show('ovResult');
  pass?SFX.score():SFX.fail();
  const bu=$('#btnUnlock');if(bu)bu.onclick=()=>{hide('ovResult');openUnlock(ch)};
  const bn=$('#btnNext');if(bn)bn.onclick=()=>{hide('ovResult');curCh=nxt;renderReq();render();toast('已切换到 '+nxt.title)};
  const bt=$('#btnTitle');if(bt)bt.onclick=()=>{hide('ovResult');SFX.unlock();sparkle(16);toast('获得称号：千禧搭配大师 🏆')};
}
function openUnlock(ch){
  const rewards=ITEMS.filter(i=>i.how===ch.reward);
  $('#unlockSub').textContent='「'+(ch.reward==='ball'?'舞会系列':'复古系列')+'」已加入衣柜，随时可穿！';
  $('#unlockGrid').innerHTML=rewards.map((it,i)=>`<div class="card" style="animation-delay:${i*90}ms">${itemSVG(it)}
    <div style="text-align:center;font-size:9.5px;font-weight:700;color:#A8758B;padding:1px 0 2px">${it.name}</div></div>`).join('');
  show('ovUnlock');SFX.unlock();
  $('#btnTryOn').onclick=()=>{
    hide('ovUnlock');
    const sig=SIGNATURE[ch.reward];sig.forEach(id=>wear(ITEM[id],true));
    SFX.wear();sparkle(14);toast('已换上「'+(ch.reward==='ball'?'月光天台':'复古唱片')+'」造型 ✨');
    renderGrid();
  };
}

/* ============ 拍照 ============ */
function photo(){
  const svg=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 750">
    <defs>${$('#scene defs').innerHTML}</defs>
    <g id="L-bg">${G.bg.innerHTML}</g>
    <g id="doll">${$('#doll').innerHTML}</g></svg>`;
  const img=new Image(), url=URL.createObjectURL(new Blob([svg],{type:'image/svg+xml'}));
  img.onload=()=>{
    const c=document.createElement('canvas');c.width=1000;c.height=1500;
    const x=c.getContext('2d');x.drawImage(img,0,0,1000,1500);
    const grd=x.createLinearGradient(0,1290,0,1420);grd.addColorStop(0,'rgba(255,255,255,0)');grd.addColorStop(.35,'rgba(255,255,255,.92)');
    x.fillStyle=grd;x.fillRect(0,1290,1000,210);
    x.fillStyle='#E1568B';x.font='900 52px "PingFang SC",sans-serif';x.textAlign='center';
    x.fillText('🎀 千禧衣橱 · 造型照',500,1372);
    x.fillStyle='#B07A90';x.font='700 30px "PingFang SC",sans-serif';
    const d=new Date(),ds=`${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}`;
    x.fillText((S.gotTitle?'千禧搭配大师 ♡  ':'')+ds,500,1418);
    const a=document.createElement('a');a.download=`千禧衣橱-${ds}.png`;a.href=c.toDataURL('image/png');a.click();
    URL.revokeObjectURL(url);toast('造型照已保存 📷');SFX.score();
  };
  img.src=url;
}

/* ============ 工具 & 事件 ============ */
function show(id){$('#'+id).classList.add('show')}
function hide(id){$('#'+id).classList.remove('show')}
let toastT=null;
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),1800)}

$('#tabFree').onclick=()=>{SFX.click();setMode('free')};
$('#tabCh').onclick=()=>{SFX.click();if(mode!=='challenge'||!curCh)openChapters();else setMode('challenge')};
$('#submitBtn').onclick=()=>{SFX.click();submit()};
$('#btnRandom').onclick=()=>{SFX.click();randomOutfit()};
$('#btnReset').onclick=()=>{SFX.click();resetOutfit();toast('已恢复默认造型')};
$('#btnPhoto').onclick=()=>{SFX.click();photo()};
$('#btnBg').onclick=()=>{
  SFX.click();
  let n=S.freeBg;
  for(let i=0;i<4;i++){n=(n+1)%4;if(!BGS[n].lock||S.cleared[BGS[n].lock])break}
  S.freeBg=n;save();render();
  if(BGS[n].lock==='lv3'&&n===3)toast('纪念背景：唱片店霓虹角 💿');
  else toast('背景：'+BGS[n].name);
};
$('#btnZen').onclick=()=>{SFX.click();document.body.classList.add('zen')};
$('#zenHint').onclick=()=>document.body.classList.remove('zen');
$('#stageWrap').addEventListener('click',e=>{if(document.body.classList.contains('zen')&&!e.target.closest('#zenHint'))document.body.classList.remove('zen')});
$('#btnMute').onclick=()=>{S.muted=!S.muted;save();$('#btnMute').textContent=S.muted?'🔇':'🔊';if(!S.muted)SFX.click()};
document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>{hide(b.closest('.overlay').id);SFX.click()});
document.addEventListener('click',()=>{if(!AC&&!S.muted){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}},{once:true});

/* 启动 */
$('#btnMute').textContent=S.muted?'🔇':'🔊';
renderTabs();renderGrid();render();
</script>
</body>
</html>
